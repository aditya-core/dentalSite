<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1512">
<title>Contact us · MA Clínica Dental</title>
<meta name="description" content="Contacta con MA Clínica Dental: teléfono, WhatsApp, email, dirección y horario.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e6b5e'/%3E%3Cpath d='M32 15c-4.3-4.3-10.6-5.4-14.9-1.9-4.5 3.7-5.9 10.1-3.7 17.6 1.9 6.4 3.2 11.7 4 17.6.5 4 2.1 6.7 5 6.7 3.5 0 4.6-3.7 5.1-8.5.5-5 1.6-8.8 4.5-8.8s4 3.8 4.5 8.8c.5 4.8 1.6 8.5 5.1 8.5 2.9 0 4.5-2.7 5-6.7.8-5.9 2.1-11.2 4-17.6 2.2-7.5.8-13.9-3.7-17.6-4.3-3.5-10.6-2.4-14.9 1.9Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main" data-skip>Saltar al contenido</a>

<main id="main">
  <section class="phead on-dark">
    <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-crumb-home>Inicio</a><i>/</i><span>Contact us</span>
      </nav>
      <h1 class="h-1">Contact us</h1>
      <p id="contactLead"></p>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2rem,4vw,3.5rem)">
    <div class="wrap g-booking">
      <div style="display:grid;gap:var(--g)">
        <div class="card info rv">
          <span class="chip-ico" id="icoPhone"></span>
          <div><h3 id="hPhone">Teléfono</h3><p><a id="aPhone"></a></p>
          <p class="tiny" style="color:var(--muted)" id="pPhoneHours"></p></div>
        </div>
        <div class="card info rv" data-d="1">
          <span class="chip-ico" id="icoWa" style="background:rgba(31,170,92,.12);color:#1faa5c"></span>
          <div><h3>WhatsApp</h3><p><a id="aWa" target="_blank" rel="noopener"></a></p>
          <p class="tiny" style="color:var(--muted)" id="pWa"></p></div>
        </div>
        <div class="card info rv" data-d="2">
          <span class="chip-ico" id="icoMail"></span>
          <div><h3 id="hMail">Email</h3><p><a id="aMail"></a></p></div>
        </div>
        <div class="card info rv" data-d="3">
          <span class="chip-ico" id="icoPin"></span>
          <div><h3 id="hHere">Cómo llegar</h3><p id="pAddr"></p>
          <a class="link-more" style="margin-top:6px" id="aMaps" target="_blank" rel="noopener"></a></div>
        </div>
        <div class="card info rv" data-d="4">
          <span class="chip-ico" id="icoClock"></span>
          <div style="width:100%"><h3 id="hHours">Horario</h3><table class="hours" id="hoursTable"></table></div>
        </div>
        <div class="card info rv" data-d="4" style="border-color:rgba(210,80,63,.25);background:#fdf6f4">
          <span class="chip-ico" id="icoEmg" style="background:rgba(210,80,63,.1);color:#a53a2b"></span>
          <div><h3 id="hOut">Urgencias fuera de horario</h3><p><a id="aEmg"></a></p>
          <p class="tiny" style="color:var(--muted)" id="pEmg"></p></div>
        </div>
      </div>

      <div class="card wizard rv" id="formCard">
        <h2 class="h-2" style="margin-bottom:8px" id="writeH">Escríbenos</h2>
        <p class="small" style="color:var(--muted);margin-bottom:1.6rem" id="writeP"></p>

        <div id="contactResult"></div>

        <form id="contactForm" novalidate>
          <div class="field" data-field="name">
            <label for="c-name" id="lName">Nombre completo</label>
            <input class="input" id="c-name" name="name" type="text" autocomplete="name">
            <span class="err"><span class="errico"></span><span></span></span>
          </div>
          <div style="height:14px"></div>
          <div class="g2" style="gap:14px">
            <div class="field" data-field="email">
              <label for="c-email" id="lEmail">Email</label>
              <input class="input" id="c-email" name="email" type="email" inputmode="email" autocomplete="email">
              <span class="err"><span class="errico"></span><span></span></span>
            </div>
            <div class="field" data-field="phone">
              <label for="c-phone" id="lPhone">Teléfono <span class="opt" id="optPhone">(opcional)</span></label>
              <input class="input" id="c-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel">
              <span class="err"><span class="errico"></span><span></span></span>
            </div>
          </div>
          <div style="height:14px"></div>
          <div class="field" data-field="subject">
            <label for="c-subject" id="lSubject">Asunto</label>
            <input class="input" id="c-subject" name="subject" type="text">
            <span class="err"><span class="errico"></span><span></span></span>
          </div>
          <div style="height:14px"></div>
          <div class="field" data-field="message">
            <label for="c-message" id="lMessage">Mensaje</label>
            <textarea class="input" id="c-message" name="message" rows="5"></textarea>
            <span class="err"><span class="errico"></span><span></span></span>
          </div>
          <div style="height:20px"></div>
          <button class="btn btn--gold btn--block btn--lg" type="submit" id="sendBtn">Preparar mensaje</button>
          <p class="tiny" style="margin-top:14px;color:var(--muted)" id="notePrivacy"></p>
        </form>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div class="map" id="map" style="aspect-ratio:21/9"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap wrap-sm">
      <div class="sec-head center rv" style="margin-inline:auto">
        <span class="eyebrow" style="justify-content:center" id="faqEyebrow"></span>
        <h2 class="h-1" id="faqH"></h2>
      </div>
      <div class="acc" id="contactFaq"></div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/contact.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var A = window.App, C = A.C, t = A.t, icon = A.icon, esc = A.esc;
    document.querySelector('[data-skip]').textContent = t('skip');
    document.querySelector('[data-crumb-home]').textContent = t('home');
    document.getElementById('contactLead').textContent = t('contactLead');
    document.title = 'Contact us · ' + C.name;

    /* icons */
    document.getElementById('icoPhone').innerHTML = icon('phone');
    document.getElementById('icoWa').innerHTML = icon('whatsapp');
    document.getElementById('icoMail').innerHTML = icon('mail');
    document.getElementById('icoPin').innerHTML = icon('pin');
    document.getElementById('icoClock').innerHTML = icon('clock');
    document.getElementById('icoEmg').innerHTML = icon('emergency');
    document.querySelectorAll('.err .errico').forEach(function (s) { s.innerHTML = icon('alert', 'ico--sm'); });

    /* content */
    document.getElementById('hPhone').textContent = t('telephone');
    var a = document.getElementById('aPhone'); a.textContent = C.phone; a.href = 'tel:' + C.phoneHref;
    document.getElementById('pPhoneHours').textContent = t('monThuHours');

    var aw = document.getElementById('aWa');
    aw.textContent = C.phone; aw.href = A.waLink(t('waGeneric'));
    document.getElementById('pWa').textContent = t('fastWay');

    document.getElementById('hMail').textContent = t('emailLbl');
    var am = document.getElementById('aMail'); am.textContent = C.email; am.href = 'mailto:' + C.email;

    document.getElementById('hHere').textContent = t('getHere');
    document.getElementById('pAddr').innerHTML = esc(C.street) + '<br>' + esc(C.city);
    var ap = document.getElementById('aMaps');
    ap.href = A.mapsHref();
    ap.innerHTML = t('openMaps') + ' ' + icon('arrow', 'ico--sm');

    document.getElementById('hHours').textContent = t('hours');
    document.getElementById('hOut').textContent = t('outHours');
    var ae = document.getElementById('aEmg'); ae.textContent = C.emergency; ae.href = 'tel:' + C.emergencyHref;
    document.getElementById('pEmg').textContent = t('painTrauma');

    /* form labels */
    document.getElementById('writeH').textContent = t('writeUs');
    document.getElementById('writeP').textContent = t('writeUsP');
    document.getElementById('lName').textContent = t('fullName');
    document.getElementById('c-name').placeholder = t('yourName');
    document.getElementById('lEmail').textContent = t('emailLbl');
    document.getElementById('c-email').placeholder = A.lang === 'en' ? 'you@example.com' : 'tucorreo@ejemplo.com';
    document.getElementById('lPhone').innerHTML = t('telephone') + ' <span class="opt">(' + t('optional') + ')</span>';
    document.getElementById('lSubject').textContent = t('subject');
    document.getElementById('c-subject').placeholder = t('aboutWhat');
    document.getElementById('lMessage').textContent = t('message');
    document.getElementById('c-message').placeholder = t('writeHere');
    document.getElementById('sendBtn').innerHTML = icon('send') + t('prepareMsg');
    document.getElementById('notePrivacy').innerHTML = icon('lock', 'ico--sm') + ' ' + t('dataUse') +
      ' <a href="legal.html#privacidad" style="color:var(--teal)">' + t('seePrivacy') + '</a>';

    /* faq */
    document.getElementById('faqEyebrow').textContent = t('beforeWrite');
    document.getElementById('faqH').textContent = t('faqEyebrow');
  });
</script>
</body>
</html>
