<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1512">
<title>Products · MA Clínica Dental</title>
<meta name="description" content="Productos de higiene y cuidado dental recomendados por el equipo de MA Clínica Dental.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e6b5e'/%3E%3Cpath d='M32 15c-4.3-4.3-10.6-5.4-14.9-1.9-4.5 3.7-5.9 10.1-3.7 17.6 1.9 6.4 3.2 11.7 4 17.6.5 4 2.1 6.7 5 6.7 3.5 0 4.6-3.7 5.1-8.5.5-5 1.6-8.8 4.5-8.8s4 3.8 4.5 8.8c.5 4.8 1.6 8.5 5.1 8.5 2.9 0 4.5-2.7 5-6.7.8-5.9 2.1-11.2 4-17.6 2.2-7.5.8-13.9-3.7-17.6-4.3-3.5-10.6-2.4-14.9 1.9Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main" data-skip>Saltar al contenido</a>

<main id="main">
  <section class="phead on-dark">
    <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-crumb-home>Inicio</a><i>/</i><span>Products</span>
      </nav>
      <h1 class="h-1">Products</h1>
      <p id="productsLead"></p>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2rem,4vw,3.5rem)">
    <div class="wrap">
      <div class="filters" id="productFilters"></div>
      <div class="flex items-center between" style="gap:12px;flex-wrap:wrap;margin-bottom:1.6rem">
        <label class="flex items-center gap-2 small" style="color:var(--muted)">
          <span id="sortLabel">Ordenar por</span>
          <select class="input" id="sortSelect" style="min-height:46px;width:auto;max-width:230px"></select>
        </label>
        <span class="small" style="color:var(--muted)" id="productCount"></span>
      </div>
      <div id="productGrid"></div>
    </div>
  </section>

  <section class="section--tight section">
    <div class="wrap">
      <div class="band">
        <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="band__row">
          <div><h2 class="h-1" id="bandH"></h2><p id="bandP"></p></div>
          <div class="band__cta">
            <a class="btn btn--gold btn--lg" href="booking.html" id="bandBook"></a>
            <a class="btn btn--outline btn--lg" href="contact.html">Contact us</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/products.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var A = window.App, t = A.t, icon = A.icon;
    document.querySelector('[data-skip]').textContent = t('skip');
    document.querySelector('[data-crumb-home]').textContent = t('home');
    document.getElementById('productsLead').textContent = t('productsP');
    document.getElementById('sortLabel').textContent = t('sortBy');
    document.getElementById('bandH').textContent = t('bandH');
    document.getElementById('bandP').textContent = t('bandP');
    document.getElementById('bandBook').innerHTML = icon('calendar', 'ico--sm') + t('book');
    document.title = 'Products · ' + A.C.name;
  });
</script>
</body>
</html>
