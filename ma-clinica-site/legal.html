<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1512">
<title>Privacidad y aviso legal · MA Clínica Dental</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main" data-skip>Saltar al contenido</a>

<main id="main">
  <section class="phead on-dark">
    <div class="mesh" aria-hidden="true"><i></i><i></i></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-crumb-home>Inicio</a><i>/</i><span id="crumbLegal">Legal</span>
      </nav>
      <h1 class="h-1" id="legalH">Privacidad y aviso legal</h1>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2rem,4vw,3.5rem)">
    <div class="wrap wrap-sm">
      <div class="legal-prose article" id="privacyBlock">
        <h2 id="p1h"></h2><p id="p1"></p>
        <h2 id="p2h"></h2><p id="p2"></p>
        <h2 id="p3h"></h2><p id="p3"></p>
        <h2 id="p4h"></h2><p id="p4"></p>
        <h2 id="p5h"></h2><p id="p5"></p>
        <h2 id="p6h"></h2><p id="p6"></p>
      </div>

      <div class="legal-prose article" id="legalBlock" style="margin-top:3.5rem;padding-top:2.5rem;border-top:1px solid var(--line)">
        <h2 id="l1h"></h2><p id="l1"></p>
        <h2 id="l2h"></h2><p id="l2"></p>
        <h2 id="l3h"></h2><p id="l3"></p>
      </div>

      <p class="center mt-3"><a class="link-more" href="index.html" id="backHome"></a></p>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var A = window.App, C = A.C, t = A.t, icon = A.icon, esc = A.esc, en = A.lang === 'en';
    document.querySelector('[data-skip]').textContent = t('skip');
    document.querySelector('[data-crumb-home]').textContent = t('home');
    document.getElementById('backHome').innerHTML = t('backHome') + ' ' + icon('arrow', 'ico--sm');

    var set = function (id, text) { document.getElementById(id).textContent = text; };

    set('legalH', en ? 'Privacy and legal notice' : 'Privacidad y aviso legal');
    set('crumbLegal', en ? 'Legal' : 'Legal');
    document.title = (en ? 'Privacy · ' : 'Privacidad · ') + C.name;

    /* privacy */
    set('p1h', en ? '1. Data controller' : '1. Responsable del tratamiento');
    set('p1', C.legal + ', ' + C.street + ', ' + C.city + '. ' + (en ? 'Contact' : 'Contacto') + ': ' + C.email + ' · ' + C.phone);
    set('p2h', en ? '2. Data we collect' : '2. Datos que recogemos');
    set('p2', en
      ? 'Name, phone or WhatsApp, email (optional), requested treatment, preferred date and time slot, a description of your case and how you found us.'
      : 'Nombre, teléfono o WhatsApp, email (opcional), tratamiento solicitado, fecha y franja horaria preferidas, descripción de tu caso y cómo nos has conocido.');
    set('p3h', en ? '3. Purpose and legal basis' : '3. Finalidad y base jurídica');
    set('p3', en
      ? 'To manage your appointment request, confirm the time and follow up your treatment. The legal basis is your explicit consent when you tick the checkbox on the form.'
      : 'Gestionar tu solicitud de cita, confirmar la hora y realizar el seguimiento del tratamiento. La base jurídica es tu consentimiento expreso al marcar la casilla del formulario.');
    set('p4h', en ? '4. Where the data goes' : '4. Destinatarios');
    set('p4', en
      ? 'We do not share your data with third parties except where legally required. The clinic team uses a private spreadsheet to organise the agenda, and WhatsApp is used to confirm appointments.'
      : 'No cedemos tus datos a terceros, salvo obligación legal. El equipo de la clínica usa una hoja de cálculo privada para organizar la agenda y WhatsApp para confirmar las citas.');
    set('p5h', en ? '5. Your rights' : '5. Tus derechos');
    set('p5', en
      ? 'You can access, rectify, delete, restrict or object to the processing of your data, and request its portability, by writing to ' + C.email + '. You may also file a complaint with the Spanish Data Protection Agency (www.aepd.es).'
      : 'Puedes acceder, rectificar, suprimir, limitar u oponerte al tratamiento de tus datos, así como solicitar su portabilidad, escribiendo a ' + C.email + '. También puedes reclamar ante la Agencia Española de Protección de Datos (www.aepd.es).');
    set('p6h', en ? '6. Retention and security' : '6. Conservación y seguridad');
    set('p6', en
      ? 'Requests are kept while the appointment is active and, once the treatment ends, for the periods required by health-record legislation. We apply restricted access, encrypted communications and periodic backups.'
      : 'Las solicitudes se conservan mientras la cita esté activa y, una vez finalizado el tratamiento, durante los plazos legales de la documentación sanitaria. Aplicamos acceso restringido, comunicaciones cifradas y copias de seguridad periódicas.');

    /* legal notice */
    set('l1h', en ? 'Website owner' : 'Titular');
    set('l1', C.legal + ' · ' + C.street + ', ' + C.city + ' · ' + C.email + ' · ' + C.phone);
    set('l2h', en ? 'Purpose' : 'Objeto');
    set('l2', en
      ? 'This website provides information about the dental services of the clinic. Browsing it makes you a user and implies acceptance of these terms.'
      : 'Este sitio web informa sobre los servicios odontológicos de la clínica. El acceso y la navegación atribuyen la condición de usuario e implican la aceptación de estas condiciones.');
    set('l3h', en ? 'Liability and applicable law' : 'Responsabilidad y legislación aplicable');
    set('l3', en
      ? 'The published information is for guidance only and does not replace an in-person clinical assessment. Quotes are confirmed after diagnosis. These terms are governed by Spanish law.'
      : 'La información publicada es orientativa y no sustituye la valoración clínica presencial. Los presupuestos se confirman tras el diagnóstico. Estas condiciones se rigen por la legislación española.');
  });
</script>
</body>
</html>
