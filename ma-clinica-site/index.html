<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1512">
<title>MA Clínica Dental · Odontología avanzada en Madrid</title>
<meta name="description" content="MA Clínica Dental: diagnóstico digital 3D, implantes, ortodoncia invisible, estética y urgencias. Primera visita y radiografía gratis. Reserva online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e6b5e'/%3E%3Cpath d='M32 15c-4.3-4.3-10.6-5.4-14.9-1.9-4.5 3.7-5.9 10.1-3.7 17.6 1.9 6.4 3.2 11.7 4 17.6.5 4 2.1 6.7 5 6.7 3.5 0 4.6-3.7 5.1-8.5.5-5 1.6-8.8 4.5-8.8s4 3.8 4.5 8.8c.5 4.8 1.6 8.5 5.1 8.5 2.9 0 4.5-2.7 5-6.7.8-5.9 2.1-11.2 4-17.6 2.2-7.5.8-13.9-3.7-17.6-4.3-3.5-10.6-2.4-14.9 1.9Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dentist",
  "name": "MA Clínica Dental",
  "description": "Odontología avanzada con trato humano",
  "telephone": "+34 910 000 000",
  "email": "hola@maclinicadental.com",
  "priceRange": "€€",
  "address": { "@type": "PostalAddress", "streetAddress": "Calle de la Salud 24, Bajo", "addressLocality": "Madrid", "postalCode": "28004", "addressCountry": "ES" },
  "openingHoursSpecification": [
    { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday"], "opens": "09:00", "closes": "20:00" },
    { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "09:00", "closes": "15:00" }
  ]
}
</script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main" data-skip>Saltar al contenido</a>

<main id="main">

  <!-- ============================ HERO ============================ -->
  <section class="hero on-dark" id="hero">
    <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wrap g-hero hero__grid">
      <div>
        <span class="eyebrow" id="heroEyebrow">Clínica dental desde 2009</span>
        <h1 class="h-hero" id="heroTitle">
          <span class="line"><span>Sonríe sin</span></span>
          <span class="line"><span><em class="hero__accent">límites,</em></span></span>
          <span class="line"><span>sin miedo.</span></span>
        </h1>
        <p class="hero__lead" id="heroLead"></p>
        <div class="hero__cta">
          <a class="btn btn--gold btn--lg" href="booking.html" id="ctaBook"></a>
          <a class="btn btn--outline btn--lg" href="#tratamientos" id="ctaTreat"></a>
        </div>
        <div class="hero__trust" id="heroTrust"></div>
      </div>

      <div class="hero__visual">
        <figure class="shot hero__shot">
          <img src="assets/img/clinic-hero.jpg" alt="" id="heroImg" width="1024" height="1024" fetchpriority="high" decoding="async">
        </figure>
        <div class="float-card fc-1" id="fc1"></div>
        <div class="float-card fc-2" id="fc2"></div>
        <div class="float-card fc-3" id="fc3"></div>
      </div>
    </div>
  </section>

  <!-- ============================ MARQUEE ============================ -->
  <div class="marquee" id="marquee" aria-hidden="true"></div>

  <!-- ============================ STATS ============================ -->
  <section class="on-dark" style="padding-block:0">
    <div class="stats" id="stats"></div>
  </section>

  <!-- ============================ SERVICES ============================ -->
  <section class="section" id="tratamientos">
    <div class="wrap sticky-grid">
      <div class="sticky-col">
        <div class="sec-head rv" style="margin-bottom:1.6rem">
          <span class="eyebrow" id="svcEyebrow"></span>
          <h2 class="h-1" id="svcH"></h2>
          <p id="svcP"></p>
        </div>
        <a class="btn btn--outline rv" href="booking.html?tratamiento=revision" id="ctaFree"></a>
      </div>
      <div class="svc-list" id="services"></div>
    </div>
  </section>

  <!-- ============================ WHY US ============================ -->
  <section class="section" style="background:var(--cream-2)">
    <div class="wrap g-hero">
      <figure class="shot shot--float rv" style="aspect-ratio:4/5">
        <img src="assets/img/clinic-team.jpg" alt="" id="roomImg" loading="lazy" decoding="async">
        <figcaption class="shot__tag" id="roomTag"></figcaption>
      </figure>
      <div class="rv" data-d="1">
        <div class="sec-head" style="margin-bottom:1.8rem">
          <span class="eyebrow" id="whyEyebrow"></span>
          <h2 class="h-1" id="whyH"></h2>
          <p id="whyP"></p>
        </div>
        <div class="g2" id="whyGrid"></div>
        <a class="link-more" href="contact.html" style="margin-top:2rem" id="meetLink"></a>
      </div>
    </div>
  </section>

  <!-- ============================ TECHNOLOGY ============================ -->
  <section class="section on-dark" id="tecnologia">
    <div class="wrap">
      <div class="sec-head rv">
        <span class="eyebrow" id="techEyebrow"></span>
        <h2 class="h-1" id="techH"></h2>
        <p id="techP"></p>
      </div>
      <div class="g3" id="tech"></div>
    </div>
  </section>

  <!-- ============================ EMERGENCY BAND ============================ -->
  <section class="section--tight section">
    <div class="wrap">
      <div class="band rv" id="emergBand">
        <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="band__row">
          <div>
            <span class="badge badge--mint" id="emergBadge" style="margin-bottom:1rem"></span>
            <h2 class="h-2" id="emergH"></h2>
            <p id="emergP"></p>
            <div class="band__cta" style="margin-top:1.6rem">
              <a class="btn btn--gold btn--lg" href="booking.html?tratamiento=dolor" id="emergBtn"></a>
              <a class="btn btn--outline btn--lg" id="emergCall"></a>
            </div>
          </div>
          <div class="spin-badge" aria-hidden="true">
            <svg viewBox="0 0 132 132">
              <defs><path id="circ" d="M66,66 m-52,0 a52,52 0 1,1 104,0 a52,52 0 1,1 -104,0"/></defs>
              <text><textPath href="#circ" id="spinText">24 h · URGENCIAS · 24 h · EMERGENCIES ·</textPath></text>
            </svg>
            <span class="core" id="spinCore"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ REVIEWS ============================ -->
  <section class="section" style="background:var(--cream-2)" id="opiniones">
    <div class="wrap">
      <div class="sec-head sec-head--split rv">
        <div>
          <span class="eyebrow" id="revEyebrow"></span>
          <h2 class="h-1" id="revH"></h2>
          <p id="revP"></p>
        </div>
        <div class="flex gap-2 items-center">
          <span class="badge badge--mint" id="revScore"></span>
        </div>
      </div>
      <div class="rail" id="rail"></div>
    </div>
  </section>

  <!-- ============================ PRODUCTS ============================ -->
  <section class="section" id="productos">
    <div class="wrap">
      <div class="sec-head sec-head--split rv">
        <div>
          <span class="eyebrow" id="prodEyebrow"></span>
          <h2 class="h-1" id="prodH"></h2>
          <p id="prodP"></p>
        </div>
        <a class="link-more" href="products.html" id="prodAll"></a>
      </div>
      <div class="g3" id="homeProducts"></div>
    </div>
  </section>

  <!-- ============================ UPDATES ============================ -->
  <section class="section" style="background:var(--cream-2)" id="novedades">
    <div class="wrap">
      <div class="sec-head sec-head--split rv">
        <div>
          <span class="eyebrow" id="updEyebrow"></span>
          <h2 class="h-1" id="updH"></h2>
          <p id="updP"></p>
        </div>
        <a class="link-more" href="updates.html" id="updAll"></a>
      </div>
      <div class="g3" id="homeUpdates"></div>
    </div>
  </section>

  <!-- ============================ FAQ ============================ -->
  <section class="section" id="faq-section">
    <div class="wrap wrap-sm">
      <div class="sec-head center rv" style="margin-inline:auto">
        <span class="eyebrow" style="justify-content:center" id="faqEyebrow"></span>
        <h2 class="h-1" id="faqH"></h2>
      </div>
      <div class="acc" id="faq"></div>
      <p class="center mt-3"><a class="link-more" href="contact.html" id="faqMore"></a></p>
    </div>
  </section>

  <!-- ============================ LOCATION ============================ -->
  <section class="section" style="background:var(--cream-2)" id="ubicacion">
    <div class="wrap g-hero">
      <div class="rv">
        <div class="sec-head" style="margin-bottom:1.8rem">
          <span class="eyebrow" id="whereEyebrow"></span>
          <h2 class="h-1" id="whereH"></h2>
          <p id="whereP"></p>
        </div>
        <div style="display:grid;gap:1.3rem" id="locRows"></div>
      </div>
      <div class="rv" data-d="1">
        <div class="map" id="map"></div>
        <div class="band" style="margin-top:var(--g);border-radius:var(--r-4);padding:1.6rem">
          <div class="mesh" aria-hidden="true"><i></i><i></i></div>
          <div style="position:relative;z-index:2">
            <h3 class="h-3" style="color:#fff" id="freeH"></h3>
            <p class="small" id="freeP" style="margin-bottom:1.2rem"></p>
            <a class="btn btn--gold btn--block" href="booking.html" id="freeBtn"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================ CTA BAND ============================ -->
  <section class="section--tight section">
    <div class="wrap">
      <div class="band rv">
        <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="band__row">
          <div>
            <h2 class="h-1" id="bandH"></h2>
            <p id="bandP"></p>
          </div>
          <div class="band__cta">
            <a class="btn btn--gold btn--lg" href="booking.html" id="bandBook"></a>
            <a class="btn btn--outline btn--lg" href="contact.html" id="bandContact"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/home.js"></script>
<script>
  /* static copy that lives in the HTML is filled in here so both languages work */
  window.addEventListener('DOMContentLoaded', function () {
    var A = window.App, C = A.C, t = A.t, icon = A.icon, esc = A.esc;

    document.querySelector('[data-skip]').textContent = t('skip');
    document.title = C.name + ' · ' + (A.lang === 'en' ? 'Dentist in ' : 'Dentista en ') + C.city;

    /* hero */
    document.getElementById('heroEyebrow').innerHTML = icon('sparkle', 'ico--sm') + ' ' + t('clinicSince') + ' ' + C.since;
    var hl = document.getElementById('heroTitle').querySelectorAll('.line > span');
    hl[0].textContent = t('heroA');
    hl[1].innerHTML = '<em class="hero__accent">' + t('heroB') + '</em>';
    hl[2].textContent = t('heroC');
    document.getElementById('heroLead').textContent = t('heroLead');
    document.getElementById('heroImg').alt = t('heroAlt');
    document.getElementById('ctaBook').innerHTML = icon('calendar') + t('bookOnline');
    document.getElementById('ctaTreat').textContent = t('seeTreatments');
    document.getElementById('heroTrust').innerHTML = ['freeFirst', 'finance', 'steril'].map(function (k) {
      return '<span>' + icon('checkCircle', 'ico--sm') + t(k) + '</span>';
    }).join('');
    document.getElementById('fc1').innerHTML = icon('star', 'ico--sm') + '<span><b>4,9 / 5</b><small>' + t('rating') + '</small></span>';
    document.getElementById('fc2').innerHTML = icon('clock', 'ico--sm') + '<span><b>' + t('fastConfirm') + '</b><small>' + t('viaWa') + '</small></span>';
    document.getElementById('fc3').innerHTML = icon('shield', 'ico--sm') + '<span><b>' + t('fixedPrice') + '</b><small>' + t('noSurprises') + '</small></span>';

    /* services */
    document.getElementById('svcEyebrow').textContent = t('services');
    document.getElementById('svcH').textContent = t('servicesH');
    document.getElementById('svcP').textContent = t('servicesP');
    document.getElementById('ctaFree').innerHTML = icon('calendar') + t('bookFree');

    /* why us */
    document.getElementById('roomImg').alt = t('roomAlt');
    document.getElementById('roomTag').innerHTML = icon('pin', 'ico--sm') + ' ' + esc(C.street);
    document.getElementById('whyEyebrow').textContent = t('whyEyebrow');
    document.getElementById('whyH').textContent = t('whyH');
    document.getElementById('whyP').textContent = t('whyP');
    document.getElementById('whyGrid').innerHTML = [1, 2, 3, 4].map(function (i) {
      return '<div class="flex gap-2" style="align-items:flex-start">' +
        '<span class="chip-ico" style="width:42px;height:42px;border-radius:14px">' + icon('check', 'ico--sm') + '</span>' +
        '<div><h3 class="h-3" style="font-size:var(--fs-3)">' + t('why' + i + 't') + '</h3>' +
        '<p class="small" style="color:var(--muted)">' + t('why' + i + 'd') + '</p></div></div>';
    }).join('');
    document.getElementById('meetLink').innerHTML = t('meetTeam') + ' ' + icon('arrow', 'ico--sm');

    /* tech */
    document.getElementById('techEyebrow').textContent = t('tech');
    document.getElementById('techH').textContent = t('techH');
    document.getElementById('techP').textContent = t('techP');

    /* emergency */
    document.getElementById('emergBadge').innerHTML = icon('emergency', 'ico--sm') + t('emerg');
    document.getElementById('emergH').textContent = t('emergH');
    document.getElementById('emergP').textContent = t('emergP');
    document.getElementById('emergBtn').innerHTML = icon('calendar', 'ico--sm') + t('emergBtn');
    document.getElementById('emergCall').innerHTML = icon('phone', 'ico--sm') + esc(C.emergency);
    document.getElementById('emergCall').href = 'tel:' + C.emergencyHref;
    document.getElementById('spinText').textContent = A.lang === 'en'
      ? '24 h · EMERGENCIES · 24 h · URGENCIAS ·' : '24 h · URGENCIAS · 24 h · EMERGENCIES ·';
    document.getElementById('spinCore').innerHTML = icon('phone', 'ico--sm');

    /* reviews */
    document.getElementById('revEyebrow').textContent = t('reviews');
    document.getElementById('revH').textContent = t('reviewsH');
    document.getElementById('revP').textContent = t('reviewsP');
    document.getElementById('revScore').innerHTML = icon('star', 'ico--sm') + '4,9 / 5 · 480+';

    /* products / updates / faq */
    document.getElementById('prodEyebrow').textContent = t('productsEyebrow');
    document.getElementById('prodH').textContent = t('productsH');
    document.getElementById('prodP').textContent = t('productsP');
    document.getElementById('prodAll').innerHTML = t('allCatalogue') + ' ' + icon('arrow', 'ico--sm');
    document.getElementById('updEyebrow').textContent = t('updatesEyebrow');
    document.getElementById('updH').textContent = t('updatesH');
    document.getElementById('updP').textContent = t('updatesP');
    document.getElementById('updAll').innerHTML = t('allUpdates') + ' ' + icon('arrow', 'ico--sm');
    document.getElementById('faqEyebrow').textContent = t('faqEyebrow');
    document.getElementById('faqH').textContent = t('faqH');
    document.getElementById('faqMore').innerHTML = t('faqMore') + ' ' + icon('arrow', 'ico--sm');

    /* location */
    document.getElementById('whereEyebrow').textContent = t('whereEyebrow');
    document.getElementById('whereH').textContent = t('whereH');
    document.getElementById('locRows').innerHTML =
      '<div class="info"><span class="chip-ico">' + icon('pin') + '</span>' +
        '<div><h3>' + t('address') + '</h3><p>' + esc(C.street) + '<br>' + esc(C.city) + '</p>' +
        '<a class="link-more" style="margin-top:6px" target="_blank" rel="noopener" href="' + A.mapsHref() + '">' +
        t('openMaps') + ' ' + icon('arrow', 'ico--sm') + '</a></div></div>' +
      '<div class="info"><span class="chip-ico">' + icon('clock') + '</span>' +
        '<div style="width:100%"><h3>' + t('hours') + '</h3><table class="hours" id="hoursTable"></table></div></div>' +
      '<div class="info"><span class="chip-ico">' + icon('phone') + '</span>' +
        '<div><h3>' + t('telephone') + '</h3><p><a href="tel:' + C.phoneHref + '">' + esc(C.phone) + '</a><br>' +
        '<a href="mailto:' + C.email + '">' + esc(C.email) + '</a></p></div></div>';
    document.getElementById('hoursTable').innerHTML = A.hoursRows();
    document.getElementById('freeH').textContent = t('freeVisit');
    document.getElementById('freeP').textContent = t('freeVisitP');
    document.getElementById('freeBtn').innerHTML = icon('calendar', 'ico--sm') + t('bookMine');

    /* band */
    document.getElementById('bandH').textContent = t('bandH');
    document.getElementById('bandP').textContent = t('bandP');
    document.getElementById('bandBook').innerHTML = icon('calendar', 'ico--sm') + t('book');
    document.getElementById('bandContact').textContent = 'Contact us';
  });
</script>
</body>
</html>
