<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1512">
<title>Pedir cita · MA Clínica Dental</title>
<meta name="description" content="Reserva tu cita en MA Clínica Dental. Te confirmamos por WhatsApp el mismo día laborable.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e6b5e'/%3E%3Cpath d='M32 15c-4.3-4.3-10.6-5.4-14.9-1.9-4.5 3.7-5.9 10.1-3.7 17.6 1.9 6.4 3.2 11.7 4 17.6.5 4 2.1 6.7 5 6.7 3.5 0 4.6-3.7 5.1-8.5.5-5 1.6-8.8 4.5-8.8s4 3.8 4.5 8.8c.5 4.8 1.6 8.5 5.1 8.5 2.9 0 4.5-2.7 5-6.7.8-5.9 2.1-11.2 4-17.6 2.2-7.5.8-13.9-3.7-17.6-4.3-3.5-10.6-2.4-14.9 1.9Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main" data-skip>Saltar al contenido</a>

<main id="main">
  <section class="phead on-dark">
    <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="wrap">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html" data-crumb-home>Inicio</a><i>/</i><span data-crumb-book>Pedir cita</span>
      </nav>
      <h1 class="h-1" id="bookH">Reserva tu cita</h1>
      <p id="bookLead"></p>
    </div>
  </section>

  <section class="section" style="padding-top:clamp(2rem,4vw,3.5rem)">
    <div class="wrap g-booking">
      <div id="bookingHost">
        <div class="card wizard">
          <div class="flex items-center between" style="gap:12px;margin-bottom:18px">
            <span class="badge badge--mint" id="stepLabel">Paso 1 de 4</span>
          </div>
          <form id="bookingForm" novalidate></form>
        </div>
      </div>

      <aside class="side">
        <div class="card rv">
          <h3 id="howH">Cómo funciona</h3>
          <ol class="numlist">
            <li><b id="s1t"></b><span id="s1d"></span></li>
            <li><b id="s2t"></b><span id="s2d"></span></li>
            <li><b id="s3t"></b><span id="s3d"></span></li>
          </ol>
        </div>

        <div class="card rv" data-d="1">
          <h3 id="incH">Incluido en tu primera visita</h3>
          <ul class="ticklist" id="incList"></ul>
        </div>

        <div class="card rv" data-d="2">
          <h3 id="talkH">¿Prefieres hablar con alguien?</h3>
          <p class="small" style="color:var(--muted);margin-bottom:14px" id="talkP"></p>
          <div style="display:grid;gap:10px">
            <a class="btn btn--outline btn--block" id="callBtn"></a>
            <a class="btn btn--mint btn--block" id="waBtn" target="_blank" rel="noopener"></a>
          </div>
          <div class="alert alert--err" style="margin-top:16px" id="emergNote"></div>
        </div>
      </aside>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/booking.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var A = window.App, C = A.C, t = A.t, icon = A.icon, esc = A.esc;
    document.querySelector('[data-skip]').textContent = t('skip');
    document.querySelector('[data-crumb-home]').textContent = t('home');
    document.querySelector('[data-crumb-book]').textContent = t('book');
    document.getElementById('bookH').textContent = t('bookH');
    document.getElementById('bookLead').textContent = t('bookLead');
    document.title = t('book') + ' · ' + C.name;

    /* sidebar */
    document.getElementById('howH').textContent = t('howFound') === t('howFound') ? (A.lang === 'en' ? 'How it works' : 'Cómo funciona') : '';
    ['s1', 's2', 's3'].forEach(function (k, i) {
      document.getElementById(k + 't').textContent = t('step' + (i + 1));
      document.getElementById(k + 'd').textContent = t('step' + (i + 1) + 'd');
    });
    document.getElementById('incH').textContent = t('included');
    document.getElementById('incList').innerHTML = ['inc1', 'inc2', 'inc3', 'inc4'].map(function (k) {
      return '<li>' + icon('checkCircle', 'ico--sm') + '<span>' + t(k) + '</span></li>';
    }).join('');
    document.getElementById('talkH').textContent = t('preferTalk');
    document.getElementById('talkP').textContent = t('preferTalkP');
    document.getElementById('callBtn').innerHTML = icon('phone', 'ico--sm') + esc(C.phone);
    document.getElementById('callBtn').href = 'tel:' + C.phoneHref;
    var wa = document.getElementById('waBtn');
    if (C.whatsapp) { wa.innerHTML = icon('whatsapp', 'ico--sm') + 'WhatsApp'; wa.href = A.waLink(t('waBook')); }
    else { wa.remove(); }
    document.getElementById('emergNote').innerHTML = icon('emergency', 'ico--sm') +
      '<span><strong>' + t('emergWithPain') + '</strong> ' + t('callUs') + ' ' + esc(C.emergency) + ' ' + t('todaySlot') + '</span>';

    /* pre-select treatment from ?tratamiento=xxx */
    var qs = new URLSearchParams(location.search).get('tratamiento');
    if (qs) {
      var radio = document.querySelector('input[name="treatment"][value="' + qs + '"]');
      if (radio) radio.checked = true;
    }
  });
</script>
</body>
</html>
